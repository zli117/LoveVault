<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5ebe0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4887a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c97b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c97b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b56a5a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c97b6b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#c97b6b" stroke-width="6" filter="url(#shadow)"/>

  <!-- Inner subtle ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#c97b6b" stroke-width="1.5" opacity="0.2"/>

  <!-- Heart shape (the vault of love) -->
  <path d="M256 380
    C 210 340, 110 280, 110 210
    C 110 165, 145 130, 183 130
    C 210 130, 235 148, 256 175
    C 277 148, 302 130, 329 130
    C 367 130, 402 165, 402 210
    C 402 280, 302 340, 256 380 Z"
    fill="url(#heartGrad)" opacity="0.95"/>

  <!-- Roof (triangle) sitting on top portion of heart -->
  <path d="M256 155 L185 215 L327 215 Z"
    fill="url(#roofGrad)" stroke="#b56a5a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Small chimney -->
  <rect x="300" y="170" width="16" height="30" rx="2" fill="#b56a5a"/>

  <!-- House body (door area within heart) -->
  <rect x="210" y="215" width="92" height="100" rx="3" fill="#fef9f4" opacity="0.9"/>

  <!-- Door -->
  <rect x="235" y="245" width="42" height="70" rx="20 20 0 0" fill="#c97b6b" opacity="0.7"/>

  <!-- Door knob / keyhole -->
  <circle cx="264" cy="285" r="5" fill="#fef9f4"/>
  <rect x="262" y="285" width="4" height="12" rx="2" fill="#fef9f4"/>

  <!-- Small window left -->
  <rect x="216" y="225" width="16" height="16" rx="3" fill="#c97b6b" opacity="0.4"/>

  <!-- Small window right -->
  <rect x="280" y="225" width="16" height="16" rx="3" fill="#c97b6b" opacity="0.4"/>

  <!-- Decorative dots around the circle -->
  <circle cx="256" cy="50" r="4" fill="#c97b6b" opacity="0.4"/>
  <circle cx="340" cy="65" r="3" fill="#c97b6b" opacity="0.3"/>
  <circle cx="172" cy="65" r="3" fill="#c97b6b" opacity="0.3"/>
  <circle cx="410" cy="110" r="3.5" fill="#c97b6b" opacity="0.3"/>
  <circle cx="102" cy="110" r="3.5" fill="#c97b6b" opacity="0.3"/>
  <circle cx="450" cy="180" r="3" fill="#c97b6b" opacity="0.25"/>
  <circle cx="62" cy="180" r="3" fill="#c97b6b" opacity="0.25"/>
</svg>
